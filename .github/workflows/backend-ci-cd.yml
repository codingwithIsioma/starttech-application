name: Backend CI-CD

on:
    push:
        branches: [main]
        paths:
            - backend/**
            - k8s/**
            - .github/workflows/backend-ci-cd.yml

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.27'
                cache-dependency-path: backend/go.sum
            
            - name: Download dependencies
              run: go mod download

            - name: Run Linter/Static Analysis
              run: go vet ./...

            - name: Run Unit Tests
              run: go test -v -race ./...

    build:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            image: ${{ steps.meta.outputs.image }}
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Setup Docker
              uses: docker/setup-docker-action@v5

            - name: Set image tag
              id: meta
              run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

            - name: Build Dockerfile
              run: |
                docker build -t ${{ steps.meta.outputs.image }} .

            # Scan base-image OS packages; fail the build on fixable HIGH/CRITICAL issues
            - name: Trivy - OS packages (blocking)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                version: 'v0.76.2'
                image-ref: '${{ steps.meta.outputs.image }}'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os'
                severity: 'CRITICAL,HIGH'
            
            # Scan Go modules in the binary; report findings without failing (app code is third-party)
            - name: Trivy - Go dependencies (report only)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                version: 'v0.76.2'
                image-ref: '${{ steps.meta.outputs.image }}'
                vuln-type: 'library'
                severity: 'CRITICAL,HIGH'
                ignore-unfixed: true
                exit-code: '0'

            - name: Push image to ECR
              run: |
                docker push ${{ steps.meta.outputs.image }}
    
    deploy:
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Update Kubernetes deployment manifest
              env:
                IMAGE: ${{ needs.build.outputs.image }}
              run: |
                sed -i "s|image: .*starttech-backend-api:.*|image: ${IMAGE}|" k8s/deployment.yaml
                grep 'image:' k8s/deployment.yaml

            - name: Connect kubectl to EKS
              run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

            - name: Create/update app secrets
              run: |
                kubectl create secret generic backend-api-secrets \
                --from-literal=MONGO_URI='${{ secrets.MONGO_URI }}' \
                --from-literal=JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
                --dry-run=client -o yaml | kubectl apply -f -

            - name: Deploy to EKS
              run: kubectl apply -f k8s/

            # wait for rollout
            - name: Wait for rollout
              run: kubectl rollout status deployment/backend-api --timeout=180s


        
              

        
