name: Backend CI-CD

on:
    push:
        branches: [features/backend-pipeline]
        paths:
            - backend/**
            - k8s/**
            - .github/workflows/backend-ci-cd.yml

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.25'
                cache-dependency-path: backend/go.sum
            
            - name: Download dependencies
              run: go mod download

            - name: Run Linter/Static Analysis
              run: go vet ./...

            - name: Run Unit Tests
              run: go test -v -race ./...

    build:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

              # test - remove for actual pipeline
            - name: Setup ECR Repository
              uses: deploy-actions/setup-ecr@v1
              with:
                RepositoryName: ${{ vars.ECR_REPOSITORY }}

            - name: Setup Docker
              uses: docker/setup-docker-action@v5

            - name: Build Dockerfile
              run: |
                docker build -t ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} .

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            - name: Push Dockerfile to ECR
              run: |
                docker push ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            
