name: Backend CI-CD

on:
    push:
        branches: [features/backend-pipeline]
        paths:
            - backend/**
            - k8s/**
            - .github/workflows/backend-ci-cd.yml

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.25'
                cache-dependency-path: backend/go.sum
            
            - name: Download dependencies
              run: go mod download

            - name: Run Linter/Static Analysis
              run: go vet ./...

            - name: Run Unit Tests
              run: go test -v -race ./...

    build:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

        
