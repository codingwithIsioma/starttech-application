name: Frontend CI-CD

on:
    push:
        branches: [features/frontend-pipeline]
        paths: 
            - frontend/**
            - .github/workflows/frontend-ci-cd.yml

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./frontend
        # outputs:
        #     artifact: ${{ steps.npm_artifact.outputs.artifact }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Install Node.js packages
              run: npm ci

            - name: Run security scan
              run: npm audit || npm audit fix

            - name: Compile static site
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              # id: npm_artifact
              with:
                name: frontend-dist
                path: frontend/dist

    
    deploy:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            #- name: Upload build file to S3 bucket
            #  run: aws s3 sync ${{ needs.test.outputs.artifact }} ${{ secrets.STATE_BUCKET }}
            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                name: frontend-dist
                path: dist

            - name: Test artifact
              run: ls -la dist
        