name: Frontend CI-CD

on:
    push:
        branches: [features/frontend-pipeline]
        paths: 
            - frontend/**
            - .github/workflows/frontend-ci-cd.yml

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: frontend
        outputs:
            artifact: ${{ steps.npm_artifact.outputs.artifact }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: {node-version: 20, cache: 'npm'}

            - name: Install Node.js packages
              run: npm ci

            - name: Run security scan
              run: npm audit

            - name: Compile static site
              id: npm_artifact
              run: npm run build
    
    deploy:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            #- name: Upload build file to S3 bucket
            #  run: aws s3 sync ${{ needs.test.outputs.artifact }} ${{ secrets.STATE_BUCKET }}
            - name: Test artifact
              run: echo "${{ needs.test.outputs.artifact }}"
        