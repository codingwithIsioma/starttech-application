name: Frontend CI-CD

on:
    push:
        branches: [main]
        paths: 
            - frontend/**

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Install Node.js packages
              run: npm ci

            - name: Run security scan
              run: npm audit || npm audit fix

            - name: Compile static site
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                name: frontend-dist
                path: frontend/dist
    
    deploy:
        needs: [test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                name: frontend-dist
                path: dist

            - name: Test artifact (Fail if index.html is missing)
              run: |
                ls -la dist
                test -f dist/index.html && echo "Artifact OK"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Upload build file to S3 bucket
              run: aws s3 sync dist/ s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete

            - name: Invalidate CloudFront cache
              run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*".

        